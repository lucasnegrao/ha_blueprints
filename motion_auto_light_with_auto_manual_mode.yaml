blueprint:
  name: Triggered Auto Light With Manual Override
  description: >
    Turns a light on from a binary sensor, turns it off optionally after a delay,
    and detects manual on/off changes so the light can be removed from the
    auto-controlled list. 
  domain: automation

  input:
    motion_sensor:
      name: Trigger sensor
      selector:
        entity:
          filter:
            - domain: input_boolean
            - domain: binary_sensor
            - domain: lock

    controlled_light:
      name: Controlled light
      selector:
        entity:
          domain: light

    enable_entity:
      name: Optional enable entity
      description: >
        Optional. Leave empty to always allow the automation.
        If set, automation only runs when this entity is on.
      default: ""
      selector:
        entity:
          filter:
            - domain: input_boolean
            - domain: binary_sensor

    auto_lights_select:
      name: Auto lights select helper
      description: Input select used by the script to track auto-controlled lights.
      default: input_select.auto_lights
      selector:
        entity:
          domain: input_select
    auto_lights_script:
      name: Auto lights script
      description: Script that receives light, auto_lights_select, and mode.
      default: script.auto_lights_2
      selector:
        entity:
          domain: script

    deactivate_delay:
      name: Deactivate delay
      description: How long after trigger turns off before running deactivate.
      default:
        seconds: 30
      selector:
        duration:
        
mode: restart
max_exceeded: silent

variables:
  enable_entity: !input enable_entity

triggers:
  - trigger: state
    entity_id: !input motion_sensor
    from: "off"
    to: "on"
    id: activate

  - trigger: state
    entity_id: !input motion_sensor
    from: "on"
    to: "off"
    for: !input deactivate_delay
    id: deactivate

  - trigger: state
    entity_id: !input controlled_light
    from:
      - "off"
      - "on"
    to:
      - "off"
      - "on"
    id: manual

conditions:
  - condition: template
    value_template: >
      {{ enable_entity == '' or is_state(enable_entity, 'on') }}
actions:
  - variables:
      light: !input controlled_light
      select: !input auto_lights_select
      script_entity: !input auto_lights_script

      is_automation_change: >
        {{ trigger.id == 'manual'
           and trigger.to_state.context.parent_id is not none }}

      light_is_managed: >
        {{ light in (state_attr(select, 'options') or []) }}

      mode: >
        {{ trigger.id }}

  - condition: template
    value_template: >
      {{ not is_automation_change or (not light_is_managed and mode == 'manual') }}

  - action: script.turn_on
    target:
      entity_id: "{{ script_entity }}"
    data:
      variables:
        auto_lights_select: "{{ select }}"
        light: "{{ light }}"
        mode: "{{ mode }}"
